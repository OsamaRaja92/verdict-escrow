name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  SOLANA_VERSION: v4.2.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the compiler, so nothing here chooses a
      # version.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The tests load the compiled program, so it has to exist first.
      - name: Build the program
        run: cargo-build-sbf --manifest-path programs/verdict-escrow/Cargo.toml --arch v3

      - name: Test
        run: cargo test --manifest-path tests/Cargo.toml
