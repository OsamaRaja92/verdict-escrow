[toolchain]
anchor_version = "1.2.1"
solana_version = "4.2.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
verdict_escrow = "DhXqHjZuT3ZJoUXzj3XmeBUMmLAwiHV4VKPZcvntTfba"

[programs.localnet]
verdict_escrow = "DhXqHjZuT3ZJoUXzj3XmeBUMmLAwiHV4VKPZcvntTfba"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The tests run in-process against the compiled program; no validator is
# started. See the README for the two commands.
test = "cargo test --manifest-path tests/Cargo.toml"
